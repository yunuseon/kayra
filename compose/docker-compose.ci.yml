# =============================================================================
# Platform CI overlay — Docker Registry + Jenkins (controller + agent)
# App-agnostic: provides CI/CD infrastructure for any application.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up
# =============================================================================

services:
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    environment:
      # registry-gc.sh deletes manifests nothing references any more.
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    # No Traefik router: builds push to registry:5000 and the host daemon pulls
    # from localhost:5000, so nothing outside the server needs it.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # BuildKit — builds images without anyone holding the host's docker socket.
  #
  # The build agent used to mount /var/run/docker.sock read-write while running
  # pipeline code checked out from arbitrary branches, which is host root by
  # design rather than by exploit. Builds now go here instead: rootless, its own
  # daemon, pushing straight to the registry. Compromising it gets you a
  # container, not the box.
  # ---------------------------------------------------------------------------
  buildkitd:
    image: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    restart: unless-stopped
    # Flags go in the command: this image does not read BUILDKITD_FLAGS (that
    # is a buildx convention), and without them it listens on a unix socket
    # the agent cannot reach.
    command:
      - --oci-worker-no-process-sandbox
      - --addr
      - tcp://0.0.0.0:1234
    # rootlesskit needs an unprivileged user namespace, which Ubuntu 23.10+
    # denies to unconfined processes. The named profile (installed by the docker
    # role) grants userns to this container alone, so the host keeps the
    # restriction.
    security_opt:
      - seccomp=unconfined
      - apparmor=buildkit-rootless
    volumes:
      - buildkit-cache:/home/user/.local/share/buildkit
      - ./buildkit/buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro
    mem_limit: 1g
    networks:
      - internal

  jenkins-controller:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    # The controller runs as jenkins (uid/gid 1000) and reaches the socket via
    # the host's docker group, whose GID differs per host.
    group_add:
      - ${DOCKER_GID:?}
    restart: unless-stopped
    # No COMPOSE_PROJECT_NAME here on purpose: every app's deploy runs
    # `docker compose` from this container, and an exported project name would
    # beat the one the deploy passes. APPS_DIR is where app .env files live.
    environment:
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-admin}
      - JENKINS_GIT_REPO=${GIT_REMOTE_URL:?}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DOMAIN=${DOMAIN:-localhost}
      - APPS_DIR=${APPS_DIR:?}
      - PLATFORM_REF=${PLATFORM_REF:?}
      - PLATFORM_RENOVATE=${PLATFORM_RENOVATE:-false}
      - RENOVATE_SCHEDULE=${RENOVATE_SCHEDULE:-H 4 * * 1}
      - RENOVATE_PLATFORM=${RENOVATE_PLATFORM:-github}
      - RENOVATE_ENDPOINT=${RENOVATE_ENDPOINT:-}
      - RENOVATE_GIT_URL=${RENOVATE_GIT_URL:-}
      - RENOVATE_GITHUB_COM_TOKEN=${RENOVATE_GITHUB_COM_TOKEN:-}
      - RENOVATE_HOST_RULES=${RENOVATE_HOST_RULES:-}
      - RENOVATE_REPOSITORIES=${RENOVATE_REPOSITORIES:-}
      # Tell JCasC to merge every YAML in this directory at startup.
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc
    volumes:
      - jenkins-home:/var/jenkins_home
      # The controller is the only node with the docker socket, and it runs
      # the deploy stage, so it needs the app's compose directory too.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_DIR:?}:${APPS_DIR:?}:ro
      - ./jenkins/casc:/var/jenkins_home/casc:ro
      # One directory per app, one file per secret; JCasC reads them with
      # ${readFile:...}. Written by bin/jenkins-app-apply.
      - ./jenkins-secrets:/run/app-secrets:ro
      # GIT_TOKEN and RENOVATE_TOKEN, likewise: files, so a new one needs a
      # reload, not a restart. Written by the platform role (or forgejo-config).
      - ./platform-secrets:/run/platform-secrets:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=platform-internal"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.routers.jenkins.tls.certresolver=le"
      - "traefik.http.routers.jenkins.middlewares=authelia@file"
      - "traefik.http.routers.jenkins.service=jenkins"
      # GitHub cannot log in; the plugin checks the payload's HMAC instead.
      - "traefik.http.routers.jenkins-webhook.rule=Host(`jenkins.${DOMAIN:-localhost}`) && Path(`/github-webhook/`)"
      - "traefik.http.routers.jenkins-webhook.entrypoints=websecure"
      - "traefik.http.routers.jenkins-webhook.tls.certresolver=le"
      - "traefik.http.routers.jenkins-webhook.priority=100"
      - "traefik.http.routers.jenkins-webhook.service=jenkins"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  jenkins-agent:
    build:
      context: ./jenkins-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    # Written by the platform role once Jenkins is up; absent on first start,
    # when the agent crash-loops until the role recreates it with the secret.
    env_file:
      - path: ./jenkins-agent.env
        required: false
    environment:
      - JENKINS_URL=http://jenkins-controller:8080
      - JENKINS_AGENT_NAME=builder
      - JENKINS_AGENT_WORKDIR=/home/jenkins/agent
      - DOMAIN=${DOMAIN:-localhost}
      # Builds go to buildkitd, not to a docker daemon. This agent runs pipeline
      # code from untrusted branches and deliberately has no docker socket.
      - BUILDKIT_HOST=tcp://buildkitd:1234
      - REGISTRY_PUSH_HOST=registry:5000
    volumes:
      - jenkins-agent-workdir:/home/jenkins/agent
    networks:
      - internal
    depends_on:
      jenkins-controller:
        condition: service_healthy
      buildkitd:
        condition: service_started

volumes:
  registry-data:
  buildkit-cache:
  jenkins-home:
  jenkins-agent-workdir:
