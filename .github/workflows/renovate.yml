# Renovate, self-hosted on GitHub's runners: keeps every pin in this
# repository current (renovate.json) without the hosted app and its account.
# It opens its PRs with RENOVATE_TOKEN, a fine-grained token on this
# repository only (Contents, Pull requests, Issues, Workflows: read and
# write), so the checks run on them as on anyone's.
name: renovate

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # renovate: datasource=docker depName=renovate/renovate
          renovate-version: 44.181.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: "Renovate <bot@renovateapp.com>"
