---
# =============================================================================
# App Playbook — registers one app with the platform.
#
# `app` is the app's entry from servers/<server>/server.yml, as JSON:
#   {"name": "x", "repo": "https://…", "ref": "main", "path": "."}
#
# Usage: kayra apps <server>
# =============================================================================

- name: Register app
  hosts: servers

  # git_token: the app's repo is fetched with it.
  vars_files:
    - "{{ server_dir }}/../defaults.yml"
    - "{{ server_dir }}/vars.yml"
    - "{{ lookup('ansible.builtin.env', 'KAYRA_SECRETS', default=undef('kayra opens secrets.yml: run this playbook through kayra')) }}"

  roles:
    - app
