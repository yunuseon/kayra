---
- name: Update the isolated lab build context
  hosts: servers
  become: true
  vars:
    platform_dir: /opt/platform
  tasks:
    - name: Copy the checkout's server modules
      ansible.builtin.copy:
        src: "{{ kayra_root }}/cli/src/{{ item }}/"
        dest: "{{ platform_dir }}/deployer/app/{{ item }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      loop: [deployer, server, contracts, lib]

    - name: Copy the deployer build definition
      ansible.builtin.copy:
        src: "{{ kayra_root }}/compose/deployer/Dockerfile.deployer"
        dest: "{{ platform_dir }}/deployer/Dockerfile.deployer"
        owner: root
        group: root
        mode: "0644"

    - name: Copy the image resolver and GC guard
      ansible.builtin.copy:
        src: "{{ kayra_root }}/scripts/platform/{{ item }}"
        dest: "{{ platform_dir }}/deployer/app/scripts/platform/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: [resolve-images.sh, registry-gc.sh]

- name: Reapply the explicit registration lab configuration
  ansible.builtin.import_playbook: live.yml

- name: Prepare a real bundle from the registered fixture repository
  hosts: servers
  become: true
  vars:
    platform_dir: /opt/platform
    registration_root: /var/lib/kayra/registration-lab
    compose_env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml{{ ':docker-compose.swarm.yml' if kayra_lab_swarm | default(false) | bool else '' }}:registration-lab.yml
    build_registration_base:
      name: "{{ fixture_app | default('indexed-build') }}"
      repo: "{{ fixture_repo }}"
      ref: main
      path: .
      runtime: "{{ fixture_runtime | default('compose') }}"
      hosts: "{{ fixture_hosts | default(['indexed.lab.test']) }}"
      secrets: [GREETING]
    build_registration: "{{ build_registration_base | combine({'grants': fixture_grants}) if fixture_runtime | default('compose') == 'swarm' else build_registration_base }}"
    request:
      app: "{{ build_registration.name }}"
      registration: "{{ build_registration }}"
      configuration:
        MODE: lab
      secrets:
        GREETING: synthetic-build-fixture
  tasks:
    - name: Register the build fixture through the host command
      ansible.builtin.command:
        argv:
          - python3
          - -B
          - "{{ platform_dir }}/registration-lib/registration_command.py"
          - register
          - --root
          - "{{ registration_root }}"
          - --private-gid
          - "1000"
          - --platform-dir
          - "{{ platform_dir }}"
        stdin: "{{ request | to_json }}"
      no_log: true
      changed_when: true

    - name: Read the build fixture's public pointer
      ansible.builtin.slurp:
        src: "{{ registration_root }}/public/{{ build_registration.name | hash('sha256') }}/current.json"
      register: pointer

    - name: Read the persisted registration policy
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, deployer, kayra-deployer, ctl, registration, policy, "{{ build_registration.name }}"]
        chdir: "{{ platform_dir }}"
      environment: "{{ compose_env }}"
      register: selected_policy
      changed_when: false

    - name: Require the verified runtime selected by the platform caller
      ansible.builtin.assert:
        that:
          - (selected_policy.stdout | from_json).runtime == build_registration.runtime
          - (selected_policy.stdout | from_json).metadata == (pointer.content | b64decode | from_json)
        quiet: true

    - name: Build and validate the bundle inside the deployer
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - deployer
          - node
          - --input-type=module
          - -e
          - |
            import { text } from 'node:stream/consumers';
            import { parseIndexedApp } from '/opt/kayra/contracts/app-registration.ts';
            import { parseRegistrationGeneration } from '/opt/kayra/contracts/registration-generation.ts';
            import { sha } from '/opt/kayra/deployer/brand.ts';
            import { builderPrepare } from '/opt/kayra/deployer/build/client.ts';
            import { parseBundle } from '/opt/kayra/deployer/build/bundle.ts';
            const input = JSON.parse(await text(process.stdin));
            const app = parseIndexedApp(input.app.name, input.app);
            const registration = parseRegistrationGeneration(input.registration);
            const commit = sha(input.commit);
            if (!app.ok || !registration.ok || !commit.ok) throw new Error('invalid fixture inputs');
            const built = await builderPrepare('http://builder:8081', app.value, commit.value, console.error, registration.value);
            if (!built.ok) throw new Error(built.error);
            const checked = parseBundle(app.value.name, commit.value, built.value, registration.value, "artifact");
            if (!checked.ok) throw new Error(checked.error);
            console.log(JSON.stringify({images: checked.value.images, registration: checked.value.registration, ...(checked.value.rollout === undefined ? {} : {rollout: checked.value.rollout})}));
        stdin: "{{ {'app':build_registration, 'registration':(pointer.content | b64decode | from_json), 'commit':fixture_commit} | to_json }}"
        chdir: "{{ platform_dir }}"
      environment: "{{ compose_env }}"
      register: bundle
      changed_when: false

    - name: Require immutable image references in the validated bundle
      ansible.builtin.assert:
        that:
          - (bundle.stdout | from_json).images | length > 0
          - (bundle.stdout | from_json).images | selectattr('ref', 'match', '^localhost:5000/' ~ build_registration.name ~ '/.+@sha256:[0-9a-f]{64}$') | list | length == (bundle.stdout | from_json).images | length
          - (bundle.stdout | from_json).registration == (pointer.content | b64decode | from_json)
        quiet: true

    - name: Retain the build through the owning coordinator
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, deployer, kayra-deployer, ctl, build, "{{ build_registration.name }}", "{{ fixture_commit }}"]
        chdir: "{{ platform_dir }}"
      environment: "{{ compose_env }}"
      register: retained_build
      changed_when: false

    - name: Verify the retained artifact without builder access
      block:
        - name: Stop the isolated builder
          ansible.builtin.command:
            argv: [docker, compose, stop, builder]
            chdir: "{{ platform_dir }}"
          environment: "{{ compose_env }}"
          changed_when: true

        - name: Restart the coordinator after retention
          ansible.builtin.command:
            argv: [docker, compose, restart, deployer]
            chdir: "{{ platform_dir }}"
          environment: "{{ compose_env }}"
          changed_when: true

        - name: Recover the same build receipt while the builder is stopped
          ansible.builtin.command:
            argv: [docker, compose, exec, -T, deployer, kayra-deployer, ctl, build, "{{ build_registration.name }}", "{{ fixture_commit }}"]
            chdir: "{{ platform_dir }}"
          environment: "{{ compose_env }}"
          register: recovered_build
          retries: 10
          delay: 2
          until: recovered_build.rc == 0
          changed_when: false

        - name: Require the exact retained receipt after restart
          ansible.builtin.assert:
            that:
              - (retained_build.stdout | from_json) == (recovered_build.stdout | from_json)
              - (recovered_build.stdout | from_json).commit == fixture_commit
              - (recovered_build.stdout | from_json).artifact is match('^[0-9a-f]{64}$')
              - (recovered_build.stdout | from_json).registration == (pointer.content | b64decode | from_json)
            quiet: true
        - name: Prove Swarm planning does not materialize secrets
          when: build_registration.runtime == 'swarm'
          block:
            - name: Temporarily hide the fixture's secret value
              ansible.builtin.command:
                argv:
                  - mv
                  - "{{ registration_root }}/private/{{ build_registration.name | hash('sha256') }}/generations/{{ (pointer.content | b64decode | from_json).registrationGeneration }}/secrets/GREETING"
                  - "{{ registration_root }}/private/{{ build_registration.name | hash('sha256') }}/generations/{{ (pointer.content | b64decode | from_json).registrationGeneration }}/secrets/GREETING.planning-test"
              changed_when: true

            - name: Preview the verified artifact while the builder and secret value are unavailable
              ansible.builtin.command:
                argv: [docker, compose, exec, -T, deployer, kayra-deployer, ctl, preview, "{{ build_registration.name }}", "{{ fixture_commit }}"]
                chdir: "{{ platform_dir }}"
              environment: "{{ compose_env }}"
              register: preview
              changed_when: false

            - name: Require a proposal with exact grants and unresolved input references
              ansible.builtin.assert:
                that:
                  - not (preview.stdout | from_json).admitted
                  - (preview.stdout | from_json).plan.commit == fixture_commit
                  - (preview.stdout | from_json).plan.registration == (pointer.content | b64decode | from_json)
                  - (preview.stdout | from_json).plan.grants == build_registration.grants
                  - (preview.stdout | from_json).plan.services.web.environment.GREETING == {'kind':'secret','key':'GREETING'}
                  - (preview.stdout | from_json).plan.services.web.environment.MODE == {'kind':'configuration','key':'MODE'}
                  - request.secrets.GREETING not in preview.stdout
                quiet: true
              no_log: true
          always:
            - name: Restore the fixture's hidden secret
              ansible.builtin.command:
                argv:
                  - mv
                  - "{{ registration_root }}/private/{{ build_registration.name | hash('sha256') }}/generations/{{ (pointer.content | b64decode | from_json).registrationGeneration }}/secrets/GREETING.planning-test"
                  - "{{ registration_root }}/private/{{ build_registration.name | hash('sha256') }}/generations/{{ (pointer.content | b64decode | from_json).registrationGeneration }}/secrets/GREETING"
              changed_when: true

      always:
        - name: Restore the isolated builder
          ansible.builtin.command:
            argv: [docker, compose, up, -d, --no-deps, builder]
            chdir: "{{ platform_dir }}"
          environment: "{{ compose_env }}"
          changed_when: true

    - name: Read coordinator image pins
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, deployer, kayra-deployer, ctl, pins]
        chdir: "{{ platform_dir }}"
      environment: "{{ compose_env }}"
      register: pins
      changed_when: false

    - name: Require retained image pins without claiming GC readiness
      ansible.builtin.assert:
        that:
          - not (pins.stdout | from_json).complete
          - (pins.stdout | from_json).unresolved | length == 0
          - (pins.stdout | from_json).artifacts | selectattr('artifact', 'equalto', (retained_build.stdout | from_json).artifact) | list | length == 1
          - ((pins.stdout | from_json).artifacts | selectattr('artifact', 'equalto', (retained_build.stdout | from_json).artifact) | first).images | sort == (bundle.stdout | from_json).images | map(attribute='ref') | sort
        quiet: true

    - name: Require GC to preserve coordinator-managed images
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, deployer, bash, /opt/kayra/scripts/platform/registry-gc.sh]
        chdir: "{{ platform_dir }}"
      environment: "{{ compose_env }}"
      register: gc_refusal
      failed_when: gc_refusal.rc == 0 or 'recovery image pins require pin-aware GC' not in gc_refusal.stderr
      changed_when: false
