# Managed by Ansible (ntfy role).
services:
  ntfy:
    image: binwiederhier/ntfy:v2.33.1
    container_name: ntfy
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ./etc:/etc/ntfy:ro
      - ./cache:/var/cache/ntfy
      - ./lib:/var/lib/ntfy
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [edge-proxy]

# The edge proxy's: Caddy reaches ntfy by its name there.
networks:
  edge-proxy:
    name: edge-proxy_default
    external: true
