# Dynamic TLS — file-based certificates for local + VM development.
# Generated by `make certs [VM_DOMAIN=...]` (mkcert under the hood).
# In prod, this directory is empty and ACME (Let's Encrypt) handles certs
# automatically. Traefik logs a warning for missing files but routes still
# work via the entrypoint's default certResolver.
tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem
