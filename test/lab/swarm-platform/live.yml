---
- name: Check experimental platform Swarm discovery alongside Compose
  hosts: servers
  become: true
  tasks:
    - name: Read the immutable host authority
      ansible.builtin.slurp:
        src: /var/lib/kayra/swarm/authority.json
      register: authority

    - name: Reconcile host setup a second time
      kayra_swarm_host:
        profile: "{{ (authority.content | b64decode | from_json).profile }}"
      register: repeated_setup

    - name: Require idempotent host setup
      ansible.builtin.assert:
        that: not repeated_setup.changed
        quiet: true

    - name: Copy the public lab certificate authority
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.pipe', 'mkcert -CAROOT') }}/rootCA.pem"
        dest: /var/lib/kayra/swarm/lab-ca.pem
        owner: root
        group: root
        mode: "0644"

    - name: Install the disposable routing probe
      ansible.builtin.copy:
        src: "{{ kayra_root }}/test/lab/swarm-platform/probe.py"
        dest: /var/lib/kayra/swarm/lab-probe.py
        owner: root
        group: root
        mode: "0600"

    - name: Verify read-only discovery and mixed routing with real TLS
      ansible.builtin.command:
        argv:
          - python3
          - -B
          - /var/lib/kayra/swarm/lab-probe.py
          - --address
          - "{{ ansible_host }}"
          - --domain
          - lab.test
          - --ca
          - /var/lib/kayra/swarm/lab-ca.pem
      register: probe
      changed_when: true

    - name: Retain the exact platform integration result
      ansible.builtin.copy:
        content: "{{ probe.stdout }}\n"
        dest: "{{ report_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Prove native version fencing and empty ownership tombstones
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, deployer, node, --input-type=module]
        stdin: "{{ lookup('ansible.builtin.file', kayra_root ~ '/test/lab/swarm-platform/native-fences.mjs') }}"
        chdir: /opt/platform
      register: fences
      changed_when: true

    - name: Retain native ownership-fence results
      ansible.builtin.copy:
        content: "{{ fences.stdout }}
"
        dest: "{{ report_path }}.native.json"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Install the native adapter plan fixture
      ansible.builtin.copy:
        src: "{{ kayra_root }}/ci/tests/swarm-http/native-plan.json"
        dest: /var/lib/kayra/swarm/lab-native-plan.json
        owner: root
        group: root
        mode: "0600"

    - name: Copy public fixture inputs into the existing deployer
      ansible.builtin.command:
        argv: [docker, compose, cp, "{{ item.source }}", "deployer:{{ item.target }}"]
        chdir: /opt/platform
      loop:
        - {source: /var/lib/kayra/swarm/lab-native-plan.json, target: /tmp/kayra-lab-native-plan.json}
        - {source: /var/lib/kayra/swarm/lab-ca.pem, target: /tmp/kayra-lab-ca.pem}
      changed_when: true

    - name: Exercise the typed native adapter in the existing deployer
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - -e
          - KAYRA_LAB_SOURCE_ROOT=/opt/kayra
          - -e
          - KAYRA_LAB_NATIVE_PLAN=/tmp/kayra-lab-native-plan.json
          - -e
          - KAYRA_LAB_CA=/tmp/kayra-lab-ca.pem
          - -e
          - KAYRA_LAB_AUTHORITY=/run/kayra-platform/swarm.json
          - -e
          - "KAYRA_LAB_ADDRESS={{ ansible_host }}"
          - deployer
          - node
          - --input-type=module
        stdin: "{{ lookup('ansible.builtin.file', kayra_root ~ '/test/lab/swarm-platform/native-adapter.mjs') }}"
        chdir: /opt/platform
      register: native_adapter
      changed_when: true

    - name: Retain the native adapter result
      ansible.builtin.copy:
        content: "{{ native_adapter.stdout }}\n"
        dest: "{{ report_path }}.adapter.json"
        mode: "0600"
      delegate_to: localhost
      become: false
