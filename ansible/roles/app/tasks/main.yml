---
# =============================================================================
# App role — the same for every app. Reads the app's app.yml and the
# operator's values for it, servers/<server>/apps/<app>.yml (config,
# plaintext) and app_secrets.<app> in its secrets.yml (SOPS), and
# registers the app:
#   {{ apps_dir }}/<app>/.env                 operator config for compose
#   app-apply                                  secrets → app-secrets/<app>/
#   app-restore                                a deployed app that runs
#                                              nothing, deployed again
#   {{ platform_dir }}/apps/<app>.json         the registration the deployer
#                                              and the builder read
#
# Compose files are not copied: the deploy takes them from the commit it
# deploys. Nothing here is specific to any app.
# =============================================================================

# With the token the builder clones with, not the operator's git credentials: a
# token that cannot read the app fails here, at registration, rather than at
# its first build. Sent as a header via the environment, so it is neither in
# the clone's config nor in the process list (Ansible prints the environment
# only at -vvv).
- name: Fetch app from its repository
  ansible.builtin.git:
    repo: "{{ app.repo }}"
    version: "{{ app.ref | default('main') }}"
    dest: "{{ fleet_root }}/.cache/apps/{{ app.name }}"
    depth: 1
    force: true
  environment:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: http.extraHeader
    GIT_CONFIG_VALUE_0: "Authorization: Basic {{ ('x-access-token:' ~ git_token) | b64encode }}"
  delegate_to: localhost
  run_once: true

- name: Resolve app source
  ansible.builtin.set_fact:
    app_root: "{{ fleet_root }}/.cache/apps/{{ app.name }}/{{ app.path | default('.') }}"
    app_repo: "{{ app.repo }}"
    app_ref: "{{ app.ref | default('main') }}"

- name: Read app.yml
  ansible.builtin.include_vars:
    file: "{{ app_root }}/app.yml"
    name: manifest

# Either may be missing: an app without config or without secrets.
- name: Read the operator's config for this app
  ansible.builtin.include_vars:
    file: "{{ server_dir }}/apps/{{ app.name }}.yml"
    name: app_config
  when: (server_dir ~ '/apps/' ~ app.name ~ '.yml') is file

- name: Take this app's secrets from secrets.yml
  ansible.builtin.set_fact:
    app_secret_values: "{{ (app_secrets | default({}))[app.name] | default({}) }}"
  no_log: true

# An app's hosts are its routes' hosts; the routes themselves are read at
# each commit, by the builder.
- name: Read the app's hosts from its routes
  ansible.builtin.set_fact:
    app_subdomains: "{{ manifest.routes | default([]) | map(attribute='host') | unique | list }}"

- name: Check the app against the platform
  ansible.builtin.assert:
    that:
      - manifest.name == app.name
      - manifest.subdomains is not defined
      - manifest.rollout is not defined
      - app.runtime is not defined or app.runtime == 'compose'
      - missing_secrets | length == 0
      - missing_config | length == 0
      - reserved_subdomains | length == 0
    fail_msg: >-
      {{ app.name }}: app.yml name={{ manifest.name }};
      {{ 'subdomains is gone: declare routes instead (the app contract);' if manifest.subdomains is defined else '' }}
      {{ 'rollout metadata is not yet supported;' if manifest.rollout is defined else '' }}
      {{ 'only the Compose runtime is currently supported;' if app.runtime is defined and app.runtime != 'compose' else '' }}
      missing config {{ missing_config }} in servers/{{ server }}/apps/{{ app.name }}.yml,
      missing secrets {{ missing_secrets }} in servers/{{ server }}/secrets.yml under app_secrets.{{ app.name }};
      hosts reserved by the platform {{ reserved_subdomains }}
    quiet: true
  vars:
    missing_secrets: "{{ manifest.secrets | default([]) | difference(app_secret_values | list) }}"
    missing_config: "{{ manifest.config | default([]) | difference(app_config | default({}) | list) }}"
    reserved_subdomains: "{{ app_subdomains | intersect(lookup('file', kayra_root ~ '/hosts.conf').splitlines() | reject('match', '^\\s*(#|$)') | list) }}"

- name: Apply Compose app registration
  kayra_compose_registration:
    app: "{{ app.name }}"
    platform_dir: "{{ platform_dir }}"
    apps_dir: "{{ apps_dir }}"
    dotenv: "{{ lookup('ansible.builtin.template', 'app.env.j2') }}"
    registration: "{{ registration | to_nice_json }}\n"
    secrets: "{% for key in manifest.secrets | default([]) %}{{ key }}={{ app_secret_values[key] }}\n{% endfor %}"
  vars:
    registration:
      name: "{{ app.name }}"
      repo: "{{ app_repo }}"
      ref: "{{ app_ref }}"
      path: "{{ app.path | default('.') }}"
      runtime: "{{ app.runtime | default('compose') }}"
      hosts: "{{ app_subdomains | map('regex_replace', '$', '.' ~ domain) | list }}"
      secrets: "{{ manifest.secrets | default([]) }}"
  register: compose_registration
  retries: 5
  delay: 3
  until: compose_registration is succeeded or not (compose_registration.retryable | default(false))
  become: true

# A Docker update or a reboot stops every container, and one deployed before
# the platform gave each service a restart policy stays down (bin/app-restore).
# The retries wait out a deployer the host layer has just restarted.
- name: Restore the app if it was deployed but runs nothing
  ansible.builtin.command:
    cmd: "{{ platform_dir }}/bin/app-restore {{ app.name }}"
  register: app_restored
  retries: 5
  delay: 3
  until: app_restored.rc == 0
  changed_when: "'restored ' in app_restored.stdout"
  become: true
