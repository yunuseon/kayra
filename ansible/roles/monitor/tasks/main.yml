---
# =============================================================================
# monitor role — Gatus, checking every minute what kayra derives for the
# servers in monitor.watch (scripts/local/monitor-endpoints.sh, passed in as
# monitor_endpoints and monitor_hosts) plus monitor.extra, and alerting through
# the notifier's ntfy after three failures, again once it has recovered.
# Watched names are pinned to their servers' addresses (extra_hosts), so home
# names resolve through the tunnel from the edge as they do at home.
# =============================================================================

- name: Check the monitor has a notifier and its tokens
  ansible.builtin.assert:
    that:
      - notifier.kind | default('') == 'ntfy'
      - notifier_ntfy_token | default('') | length > 0
      - monitor_endpoints is defined
      - monitor_endpoints | selectattr('health') | map(attribute='group') | difference(monitor_health_tokens | default({}) | list) | length == 0
    fail_msg: >-
      the monitor alerts through the notifier (kind ntfy, notifier_ntfy_token in secrets.yml) and reads each
      watched platform server's deploy.<domain>/health with monitor_health_tokens.<server> (that server's
      health_token) in servers/{{ server }}/secrets.yml
    quiet: true

- name: Create monitor directories
  ansible.builtin.file:
    path: "/opt/monitor/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["", config]

- name: Render the monitor's compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/monitor/docker-compose.yml
    mode: "0644"

- name: Render the monitor's tokens
  ansible.builtin.template:
    src: env.j2
    dest: /opt/monitor/.env
    mode: "0600"
  diff: false
  register: monitor_env

# Into config/, mounted as a directory: Gatus reloads the file when it
# changes, which a single-file bind mount would never show it.
- name: Render Gatus's config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /opt/monitor/config/config.yaml
    mode: "0644"

- name: Start the monitor
  community.docker.docker_compose_v2:
    project_src: /opt/monitor
    recreate: "{{ 'always' if monitor_env is changed else 'auto' }}"
