---
- name: Check durable HTTP coordination with the real runtime and TLS router
  hosts: servers
  become: true
  tasks:
    - name: Create an isolated component source directory
      ansible.builtin.tempfile:
        state: directory
        path: /var/lib/kayra/swarm
        prefix: coordinator-source-
      register: coordinator_source

    - name: Create fixture source parents
      ansible.builtin.file:
        path: "{{ coordinator_source.path }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: [cli/src, ci/tests/swarm-http, test/lab/swarm-platform]

    - name: Copy server code into the isolated source tree
      ansible.builtin.copy:
        src: "{{ kayra_root }}/cli/src/"
        dest: "{{ coordinator_source.path }}/cli/src/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Copy component fixture inputs
      ansible.builtin.copy:
        src: "{{ kayra_root }}/{{ item }}"
        dest: "{{ coordinator_source.path }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      loop:
        - package.json
        - ci/tests/swarm-http/native-plan.json
        - test/lab/swarm-platform/http-coordinator.mjs
        - test/lab/swarm-platform/recovery-overlap.mjs
        - test/lab/swarm-platform/one-shot.mjs
        - test/lab/swarm-platform/migration-probe.mjs

    - name: Find the existing deployer container
      ansible.builtin.command:
        argv: [docker, compose, ps, -q, deployer]
        chdir: /opt/platform
      register: coordinator_deployer
      changed_when: false

    - name: Copy the existing image's Node runtime and contract dependencies
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - "{{ coordinator_deployer.stdout | trim }}:{{ item.source }}"
          - "{{ coordinator_source.path }}/{{ item.target }}"
      loop:
        - {source: /usr/local/bin/node, target: node}
        - {source: /opt/kayra/node_modules, target: node_modules}
      changed_when: true

    - name: Reconcile and promote with a SIGKILL after native acknowledgement
      ansible.builtin.command:
        argv:
          - "{{ coordinator_source.path }}/node"
          - "{{ coordinator_source.path }}/test/lab/swarm-platform/http-coordinator.mjs"
      register: coordinator_result
      changed_when: true

    - name: Retain the component result
      ansible.builtin.copy:
        content: "{{ coordinator_result.stdout }}\n"
        dest: "{{ report_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Measure draining old, candidate and restored workload overlap
      ansible.builtin.command:
        argv:
          - "{{ coordinator_source.path }}/node"
          - "{{ coordinator_source.path }}/test/lab/swarm-platform/recovery-overlap.mjs"
          - "{{ coordinator_source.path }}/recovery-overlap.json"
      register: recovery_overlap
      changed_when: true

    - name: Retain the recovery-overlap result
      ansible.builtin.copy:
        content: "{{ recovery_overlap.stdout }}\n"
        dest: "{{ report_path }}.overlap.json"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Preserve native recovery-overlap snapshots before source cleanup
      ansible.builtin.fetch:
        src: "{{ coordinator_source.path }}/recovery-overlap.json"
        dest: "{{ report_path }}.overlap.native.json"
        flat: true

    - name: Interrupt isolated one-shot jobs at create, start and fence checkpoints
      ansible.builtin.command:
        argv:
          - "{{ coordinator_source.path }}/node"
          - "{{ coordinator_source.path }}/test/lab/swarm-platform/one-shot.mjs"
          - run
          - "{{ coordinator_source.path }}/jobs"
          - "{{ (coordinator_result.stdout | from_json).image }}"
      changed_when: true

    - name: Retain one-shot interruption summary
      ansible.builtin.fetch:
        src: "{{ coordinator_source.path }}/jobs/result.json"
        dest: "{{ report_path }}.jobs.json"
        flat: true

    - name: Archive one-shot journals, traces and Docker events before cleanup
      ansible.builtin.command:
        argv: [tar, -cf, "{{ coordinator_source.path }}/jobs.tar", -C, "{{ coordinator_source.path }}/jobs", .]
      changed_when: true

    - name: Preserve one-shot interruption evidence
      ansible.builtin.fetch:
        src: "{{ coordinator_source.path }}/jobs.tar"
        dest: "{{ report_path }}.jobs.tar"
        flat: true

    - name: Normalize application status-probe outcomes without persisting private stdout
      ansible.builtin.command:
        argv:
          - "{{ coordinator_source.path }}/node"
          - "{{ coordinator_source.path }}/test/lab/swarm-platform/migration-probe.mjs"
          - "{{ coordinator_source.path }}/probes"
          - "{{ (coordinator_result.stdout | from_json).image }}"
      changed_when: true

    - name: Retain application status-probe summary
      ansible.builtin.fetch:
        src: "{{ coordinator_source.path }}/probes/result.json"
        dest: "{{ report_path }}.probes.json"
        flat: true

    - name: Archive normalized probe evidence and journals
      ansible.builtin.command:
        argv: [tar, -cf, "{{ coordinator_source.path }}/probes.tar", -C, "{{ coordinator_source.path }}/probes", .]
      changed_when: true

    - name: Preserve normalized application status-probe evidence
      ansible.builtin.fetch:
        src: "{{ coordinator_source.path }}/probes.tar"
        dest: "{{ report_path }}.probes.tar"
        flat: true

    - name: Remove successful component source files
      ansible.builtin.file:
        path: "{{ coordinator_source.path }}"
        state: absent
