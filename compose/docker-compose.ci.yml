# =============================================================================
# Platform CI overlay — Docker Registry, BuildKit, the builder and the deployer
# App-agnostic: provides CI/CD infrastructure for any application.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up
# =============================================================================

services:
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    environment:
      # registry-gc.sh deletes manifests nothing references any more.
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    # No Traefik router: builds push to registry:5000 and the host daemon pulls
    # from localhost:5000, so nothing outside the server needs it.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # BuildKit — builds images without anyone holding the host's docker socket.
  #
  # The build agent used to mount /var/run/docker.sock read-write while running
  # pipeline code checked out from arbitrary branches, which is host root by
  # design rather than by exploit. Builds now go here instead: rootless, its own
  # daemon, pushing straight to the registry. Compromising it gets you a
  # container, not the box.
  # ---------------------------------------------------------------------------
  buildkitd:
    image: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    restart: unless-stopped
    # Flags go in the command: this image does not read BUILDKITD_FLAGS (that
    # is a buildx convention), and without them it listens on a unix socket
    # the agent cannot reach.
    command:
      - --oci-worker-no-process-sandbox
      - --addr
      - tcp://0.0.0.0:1234
    # rootlesskit needs an unprivileged user namespace, which Ubuntu 23.10+
    # denies to unconfined processes. The named profile (installed by the docker
    # role) grants userns to this container alone, so the host keeps the
    # restriction.
    security_opt:
      - seccomp=unconfined
      - apparmor=buildkit-rootless
    volumes:
      - buildkit-cache:/home/user/.local/share/buildkit
      - ./buildkit/buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro
    mem_limit: 1g
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # The builder: clones app repos and builds their images through buildkitd,
  # answers forge webhooks, shows the runs. Faces app code and the internet,
  # so it gets no docker socket, no docker CLI and no app secrets.
  # ---------------------------------------------------------------------------
  builder:
    build:
      context: ./deployer
      dockerfile: Dockerfile.builder
    restart: unless-stopped
    command: ["builder"]
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - BUILDKIT_HOST=tcp://buildkitd:1234
      - REGISTRY_PUSH_HOST=registry:5000
    volumes:
      - builder-work:/work
      - ./apps:/opt/platform/apps:ro
      - ./runs:/opt/platform/runs:ro
      # GIT_TOKEN, to clone. Files, so a new one needs no restart.
      - ./platform-secrets:/run/platform-secrets:ro
    mem_limit: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=platform-internal"
      - "traefik.http.routers.deploy.rule=Host(`deploy.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.deploy.entrypoints=websecure"
      - "traefik.http.routers.deploy.tls.certresolver=le"
      - "traefik.http.routers.deploy.middlewares=authelia@file"
      - "traefik.http.routers.deploy.service=deploy"
      # Forges cannot log in; the builder checks the payload's HMAC instead.
      - "traefik.http.routers.deploy-hook.rule=Host(`deploy.${DOMAIN:-localhost}`) && PathPrefix(`/hook/`)"
      - "traefik.http.routers.deploy-hook.entrypoints=websecure"
      - "traefik.http.routers.deploy-hook.tls.certresolver=le"
      - "traefik.http.routers.deploy-hook.priority=100"
      - "traefik.http.routers.deploy-hook.service=deploy"
      - "traefik.http.services.deploy.loadbalancer.server.port=8080"
    networks:
      - internal
    depends_on:
      buildkitd:
        condition: service_started

  # ---------------------------------------------------------------------------
  # The deployer: the queue, admission, `docker compose up`, release records,
  # commit statuses, and the platform's jobs (registry GC, Renovate, the
  # hourly poll). The one container here with the docker socket and the app
  # secrets; Traefik never routes to it. Everything it gets from the builder
  # is checked again, and compose files still go through the policy.
  #
  # No COMPOSE_PROJECT_NAME here on purpose: every deploy runs `docker
  # compose -p <app>`, and an exported project name would beat it. The
  # platform's directories are mounted at their own paths.
  # ---------------------------------------------------------------------------
  deployer:
    build:
      context: ./deployer
      dockerfile: Dockerfile.deployer
    restart: unless-stopped
    command: ["deployer"]
    # The socket's group, whose GID differs per host.
    group_add:
      - ${DOCKER_GID:?}
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - APPS_DIR=${APPS_DIR:?}
      - PLATFORM_DIR=/opt/platform
      - PLATFORM_RENOVATE=${PLATFORM_RENOVATE:-false}
      - RENOVATE_SCHEDULE=${RENOVATE_SCHEDULE:-0 4 * * 1}
      - RENOVATE_PLATFORM=${RENOVATE_PLATFORM:-github}
      - RENOVATE_ENDPOINT=${RENOVATE_ENDPOINT:-}
      - RENOVATE_GIT_URL=${RENOVATE_GIT_URL:-}
      - RENOVATE_GITHUB_COM_TOKEN=${RENOVATE_GITHUB_COM_TOKEN:-}
      - RENOVATE_HOST_RULES=${RENOVATE_HOST_RULES:-}
      - RENOVATE_REPOSITORIES=${RENOVATE_REPOSITORIES:-}
      - SERVER=${SERVER:-}
      - NOTIFIER=${NOTIFIER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_DIR:?}:${APPS_DIR:?}:ro
      - ./apps:/opt/platform/apps:ro
      - ./runs:/opt/platform/runs
      - ./releases:/opt/platform/releases
      # The alerts open now: one file per key, holding where it is open.
      - ./alerts:/opt/platform/alerts
      # The notifier's key; mounted nowhere else.
      - ./deployer-secrets:/run/deployer-secrets:ro
      # One directory per app, one file per secret. Written by bin/app-apply.
      - ./app-secrets:/run/app-secrets:ro
      # GIT_TOKEN (commit statuses) and RENOVATE_TOKEN.
      - ./platform-secrets:/run/platform-secrets:ro
    mem_limit: 512m
    networks:
      - internal

volumes:
  registry-data:
  buildkit-cache:
  builder-work:
