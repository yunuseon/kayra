---
# =============================================================================
# Restore test — starts the restic-backup role's restore test on the server,
# detached: the latest backup, restored to a scratch dir and checked. kayra
# follows its log over SSH afterwards.
#
# Usage: kayra backup test <server>
# =============================================================================

- name: Start the restore test
  hosts: servers
  become: true
  gather_facts: false

  # ansible_become_password, where the server has one (a NAS).
  vars_files:
    - "{{ server_dir }}/vars.yml"
    - "{{ lookup('ansible.builtin.env', 'KAYRA_SECRETS', default=undef('kayra opens secrets.yml: run this playbook through kayra')) }}"

  tasks:
    - name: Start the restore test
      ansible.builtin.command:
        cmd: docker compose -f {{ restic_backup.dir }}/docker-compose.yml exec -d -T backup /etc/backup/restore-test.sh
      changed_when: true
