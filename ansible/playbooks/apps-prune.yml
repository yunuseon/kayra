---
# =============================================================================
# Apps-prune playbook — removes every app registered on the server that
# server.yml no longer lists. Registered = has an apps/<app>.json, the one
# file every app gets. A pending marker also keeps interrupted removals visible.
# Data (volumes) is kept; see bin/app-remove.
#
# `keep` is the list of app names in server.yml, as JSON.
# Usage: kayra apps <server>  (runs this after registering the apps)
# =============================================================================

- name: Prune apps
  hosts: servers
  become: true

  vars:
    platform_dir: /opt/platform

  tasks:
    - name: Find registered apps and incomplete removals
      ansible.builtin.find:
        paths:
          - "{{ platform_dir }}/apps"
          - "{{ platform_dir }}/removing"
        patterns: "*.json"
      register: registrations

    - name: Read managed registrations from the lifecycle owner
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, deployer, kayra-deployer, ctl, lifecycle, list-managed]
        chdir: "{{ platform_dir }}"
      changed_when: false
      register: managed_registration_list
      when: prune_managed | default(false) | bool and not ansible_check_mode

    - name: Remove apps no longer in server.yml
      ansible.builtin.command: "{{ platform_dir }}/bin/app-remove {{ item }}"
      loop: "{{ (registered + managed_registrations) | unique | difference(keep) }}"
      vars:
        managed_registrations: "{{ managed_registration_list.stdout | default('[]') | from_json }}"
        registered: "{{ registrations.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.json$', '') | list }}"
      changed_when: true
