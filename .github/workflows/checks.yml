# The platform's checks (linters, validators and CLAUDE.md's rules; see
# ci/checks/) on every push and pull request. The checks are a Docker build
# whose last RUN is run.sh --platform; a fleet runs the same image with its
# own part (--fleet).
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --progress plain -f ci/checks/Dockerfile .
